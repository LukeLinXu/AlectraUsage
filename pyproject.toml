[project]
name = "alectra-plan-compare"
version = "0.1.0"
description = "Compare Ontario RPP electricity rate plans (Tiered / TOU / Ultra-Low Overnight) using your real My Alectra smart-meter data. Runs locally; your credentials never leave your machine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "lukelin" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "playwright>=1.44",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
alectra-plans = "alectra_plans.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["alectra_plans*"]

[tool.setuptools.package-data]
alectra_plans = ["static/**/*"]
